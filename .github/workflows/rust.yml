name: tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install llvm-tools-preview
      run: rustup component add llvm-tools-preview
    - uses: Swatinem/rust-cache@v2
    - uses: taiki-e/install-action@cargo-llvm-cov
    - name: Build
      run: cargo build --verbose
    - name: Run tests with coverage
      run: cargo llvm-cov --verbose --fail-under-lines 90
    - name: Run lints
      run: cargo clippy --verbose --tests -- -D warnings
    - name: Check docs
      run: cargo doc --no-deps --verbose
      env:
        RUSTDOCFLAGS: -D warnings
    - name: Check formatting
      run: cargo fmt --verbose --check

  automerge:
    needs: [build]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    # dependabot-triggered runs get a read-only token unless a job asks for more
    permissions:
      contents: write
      pull-requests: write
    steps:
    - run: gh pr merge --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_URL: ${{ github.event.pull_request.html_url }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
